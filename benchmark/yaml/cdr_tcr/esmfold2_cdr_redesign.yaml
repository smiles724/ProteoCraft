launch_profile: esmfold2_d
input_dir: benchmark/input/cdr_tcr_case
output_dir: benchmark/outputs/esmfold2_cdr_redesign
device: cuda
seed: 43

# The common two-stage search, candidate construction, and strict truncated
# One-step settings come from the formal ESMFold2 profile. CDR redesign keeps
# only the CDR motif mutable; framework residues remain fixed.
esmfold2_verifier_num_loops: 4
esmfold2_verifier_num_sampling_steps: 50

cases:
  - id: 9NMW_alpha
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVNNARLMFGDGTQL
  - id: 9NMW_beta
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASSVAGSPEAFF
  - id: 1QRN_alpha
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF
  - id: 1QRN_beta
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
