input_dir: benchmark/input/cdr_tcr_case
output_dir: benchmark/outputs/esmfold2_cdr_redesign
device: cuda
seed: 42

# First validation surface: keep the tested ESMFold2 Stage-A search and only
# redesign the CDR motif. Stage B can be enabled after the CDR smoke is sound.
n_steps: 70
mcts_strategy: stage_a_only
mcts_num_beams: 8
mcts_bootstrap_steps: 50
mcts_bootstrap_max_steps: 70
mcts_expand_actions_per_step: 2
k_top: 10
b_candidates: 8
t_sample: 1.0
max_mutations_per_seq: 3
stagea_max_mutations_per_seq: 3
stageb_max_mutations_per_seq: 1

esmfold2_stagea_soft_steps: 30
esmfold2_stageb_soft_steps: 20
esmfold2_experimental_model: biohub/ESMFold2-Experimental-Fast
esmfold2_verifier_model: biohub/ESMFold2
esmfold2_verifier_num_loops: 20
esmfold2_verifier_num_sampling_steps: 200
esmfold2_proposal_num_loops: 1
esmfold2_proposal_num_sampling_steps: 1
esmfold2_proposal_load_internal_esmc: true
esmfold2_proposal_lm_dropout: 0.5
esmfold2_force_proposal_lm_dropout: true
# Optional differentiable coordinate proposal. Keep disabled to preserve the
# established CDR Stage-A baseline; set true for CDR one-step experiments.
esmfold2_one_step_diffusion: false
esmfold2_one_step_diffusion_tau: 4.0
esmfold2_one_step_diffusion_weight: 1.0
esmfold2_one_step_diffusion_rg_weight: 0.3
esmfold2_one_step_diffusion_interval: 0
esmfold2_one_step_recycle_coordinates: false
esmfold2_one_step_diffusion_hotspot: false
esmfold2_distogram_hotspot: true
esmfold2_verifier_loss_mode: pair_chain_iptm
esmfold2_lambda_esmc: auto
esmfold2_logit_init_mode: official_exact
esmfold2_stagea_handoff_checkpoint_interval: 10

cases:
  - id: 9NMW_alpha
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVNNARLMFGDGTQL
  - id: 9NMW_beta
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASSVAGSPEAFF
  - id: 1QRN_alpha
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF
  - id: 1QRN_beta
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
