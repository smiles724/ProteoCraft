# De novo TCR design against HLA-A*02:01 + three 9-mer peptides.
#
# Inputs are generated by scripts/prepare_denovo_tcr_cases.py from a
# NON-COGNATE scaffold (the A6 TCR / HLA-A2 complex of 1QRN): framework and
# docking geometry come from the scaffold, the peptide chain is threaded onto
# the design target, and only CDR residues are mutable. The experimentally
# known cognate TCRs for these three peptides are NOT used anywhere here --
# they are reserved for post-hoc sanity checking.
#
# Chain roles (same convention as cdr_tcr_domain_redesign.yaml):
#   A = MHC class I heavy chain (HLA-A*02:01, residues 1-180)
#   B = beta-2-microglobulin (present in the FASTA, not modelled by default)
#   C = target peptide  -> target_chains
#   D = TCR alpha, E = TCR beta  -> one is binder, the other is scaffold
#
# Smoke test (one peptide, alpha chain, 3 steps):
#   python benchmark/script/run_cdr_tcr_domain_redesign.py \
#     --config benchmark/yaml/cdr_tcr/denovo_tcr_a0201_3cases.yaml \
#     --case ALGRRIPPV_alpha --n-steps 3
#
# Dry run with no GPU (validates FASTA/template/CDR mask only):
#   python benchmark/script/run_cdr_tcr_domain_redesign.py \
#     --config benchmark/yaml/cdr_tcr/denovo_tcr_a0201_3cases.yaml --prepare-only

input_dir: benchmark/input/denovo_tcr_case
output_dir: benchmark/outputs/denovo_tcr
log_file: benchmark/outputs/denovo_tcr/launcher.log

# --- Site-specific paths (Polaris / IMPROVE_Aim1) ---------------------------
model_checkpoint_dir: /lus/eagle/projects/IMPROVE_Aim1/caom/nanobody_developability/protenix_ckpt
components_cache_dir: /home/caom/common
protenix_root_dir: benchmark/protenix_runtime
model_name: protenix_base_default_v1.0.0
device: cuda:0

# --- Search ----------------------------------------------------------------
mode: mcts
n_steps: 150
learning_rate: 0.05
tau_noise: 4.0
k_top: 8
b_candidates: 4
t_sample: 1.0
max_mutations_per_seq: 3
use_annealing: true
t_init: 1.0
t_min: 0.01
use_tau_scheduling: true
tau_jitter: true
mcts_c: 1.0
mcts_max_nodes: 5000
mcts_tau_fixed: 4.0
mcts_num_beams: 8
mcts_strategy: two_stage
mcts_bootstrap_steps: 50
mcts_bootstrap_patience: 10
mcts_bootstrap_min_delta: 0.02
mcts_bootstrap_max_steps: 80
mcts_handoff_top_k: null
mcts_expand_actions_per_step: 2
mcts_prior_mode: full
chunk_size: null
use_prior: true
prior_strength: 0.1

# --- Structure loss weights (identical to the 4-case config) ---------------
w_plddt: 0.1
w_pae: 0.4
w_i_pae: 0.1
w_con: 1.0
w_i_con: 3.0
w_iptm: 0.05
w_rg: 0.3
w_helix: -0.3
w_clash: 0.5
w_i_clash: 0.5
w_pde: 0.02
w_i_pde: 0.01

# --- TCR sequence prior ----------------------------------------------------
# The paired control for the main-line question ("does the prior bias designs
# toward natural TCR-like solutions?") is this same file with both flags set
# to false; keep every other field identical so the runs stay comparable.
use_tcr_prior_gradient: true
tcr_prior_gradient_weight: 0.1
use_tcr_prior_verifier: true
tcr_prior_verifier_weight: 0.1
tcr_prior_region: cdr
tcr_prior_model_name: esmc:esmc_300m
require_real_tcr_prior: true

save_checkpoints: true
checkpoint_subdir_name: checkpoints

cases:
  - id: ALGRRIPPV_alpha
    fasta_path: A6scaffold_ALGRRIPPV.fasta
    template_path: A6scaffold_ALGRRIPPV.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF
  - id: ALGRRIPPV_beta
    fasta_path: A6scaffold_ALGRRIPPV.fasta
    template_path: A6scaffold_ALGRRIPPV.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
  - id: YLNPRVARI_alpha
    fasta_path: A6scaffold_YLNPRVARI.fasta
    template_path: A6scaffold_YLNPRVARI.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF
  - id: YLNPRVARI_beta
    fasta_path: A6scaffold_YLNPRVARI.fasta
    template_path: A6scaffold_YLNPRVARI.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
  - id: KLNPRIPRI_alpha
    fasta_path: A6scaffold_KLNPRIPRI.fasta
    template_path: A6scaffold_KLNPRIPRI.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF
  - id: KLNPRIPRI_beta
    fasta_path: A6scaffold_KLNPRIPRI.fasta
    template_path: A6scaffold_KLNPRIPRI.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
