# ProteoCraft-ESMFold2 D method for the four CDR redesign cases in the
# 59-run benchmark.
#
# Run all four cases serially on one GPU:
#   python benchmark/script/run_esmfold2_cdr_redesign.py \
#     --config benchmark/yaml/cdr_tcr/esmfold2_cdr_redesign_d_4cases.yaml \
#     --device cuda:0
#
# Run one case:
#   python benchmark/script/run_esmfold2_cdr_redesign.py \
#     --config benchmark/yaml/cdr_tcr/esmfold2_cdr_redesign_d_4cases.yaml \
#     --case 9NMW_alpha --device cuda:0
#
# ESMFold2 is sequence-only here. Template paths are retained for case
# provenance and downstream evaluation, but are not consumed by the model.

launch_profile: esmfold2_d
input_dir: benchmark/input/cdr_tcr_case
output_dir: benchmark/outputs/esmfold2_cdr_redesign_d_seed42
device: cuda
seed: 42

# D method: Stage-A-only MCTS with hierarchical Root-UCB.
n_steps: 70
learning_rate: 0.05
mcts_strategy: stage_a_only
mcts_num_beams: 8
mcts_expand_actions_per_step: 2
mcts_prior_mode: full
k_top: 10
b_candidates: 8
t_sample: 1.0

# Only the CDR motif is mutable. Mutation candidates use at most three CDR
# substitutions; the raw argmax child may update any position allowed by the
# mutable mask. Framework positions remain fixed.
max_mutations_per_seq: 3
stagea_max_mutations_per_seq: 3
stageb_max_mutations_per_seq: 1

# Stage A soft proposal and tree policy.
esmfold2_stagea_soft_steps: 30
esmfold2_stageb_soft_steps: 20
esmfold2_stagea_tree_children: 2
esmfold2_stagea_root_selection_mode: hierarchical_ucb
esmfold2_stagea_min_root_expansions: 2
esmfold2_stagea_preserve_soft_state: true
esmfold2_stagea_cumulative_annealing: false
esmfold2_stagea_paired_verifier_seed: true
esmfold2_logit_init_mode: official_exact

# ESMFold2 proposal, ESMC prior, and full verifier.
esmfold2_experimental_model: biohub/ESMFold2-Experimental-Fast
esmfold2_verifier_model: biohub/ESMFold2
esmfold2_proposal_num_loops: 1
esmfold2_proposal_num_sampling_steps: 1
esmfold2_proposal_load_internal_esmc: true
esmfold2_proposal_lm_dropout: 0.5
esmfold2_force_proposal_lm_dropout: true
esmfold2_lambda_esmc: auto
esmfold2_verifier_num_loops: 20
esmfold2_verifier_num_sampling_steps: 200
esmfold2_verifier_loss_mode: aligned_common

# Periodic One-step diffusion used by method D.
esmfold2_one_step_diffusion: true
esmfold2_one_step_diffusion_tau: 2.0
esmfold2_one_step_diffusion_weight: 0.25
esmfold2_one_step_diffusion_rg_weight: 0.1
esmfold2_one_step_diffusion_interval: 5
esmfold2_one_step_recycle_coordinates: false
esmfold2_one_step_diffusion_hotspot: false

# CDR cases do not define residue-level hotspots. Global distogram contact loss
# remains active independently; hotspot-specific proposal/verifier terms add
# nothing because no hotspot indices are provided.
esmfold2_distogram_hotspot: true
esmfold2_hotspot_cutoff: 8.0
esmfold2_hotspot_satisfied_proposal_weight: 0.0
esmfold2_hotspot_interface_mode: localized
esmfold2_hotspot_verify_weight: 0.0
esmfold2_hotspot_verify_near_cutoff: 8.0
esmfold2_hotspot_verify_far_cutoff: 20.0
esmfold2_hotspot_verify_min_distance: 2.5
esmfold2_hotspot_verify_too_close_weight: 0.0

esmfold2_track_proposal_confidence: false
esmfold2_final_polish: false
esmfold2_stagea_handoff_checkpoint_interval: 10
checkpoint_save_policy: all

cases:
  - id: 9NMW_alpha
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVNNARLMFGDGTQL

  - id: 9NMW_beta
    fasta_path: rcsb_pdb_9NMW_abtrunc.fasta
    template_path: 9NMW.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASSVAGSPEAFF

  - id: 1QRN_alpha
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: D
    target_chains: [C]
    scaffold_chains: [A, E]
    cdr_motif: CAVTTDSWGKLQF

  - id: 1QRN_beta
    fasta_path: rcsb_pdb_1QRN_abtrunc.fasta
    template_path: 1QRN_fixed_template.cif
    binder_chain: E
    target_chains: [C]
    scaffold_chains: [A, D]
    cdr_motif: CASRPGLAGGRPEQYF
