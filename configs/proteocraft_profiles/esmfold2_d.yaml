schema_version: 1
name: esmfold2_d
description: Primary ESMFold2 Stage-A MCTS with hierarchical Root-UCB.

defaults:
  mode: mcts
  model_backend: esmfold2
  esmfold2_task_type: denovo
  esmfold2_verifier_model: biohub/ESMFold2
  esmfold2_experimental_model: biohub/ESMFold2-Experimental-Fast
  binder_length: 120
  n_steps: 70
  learning_rate: 0.05
  seed: 42
  k_top: 10
  b_candidates: 8
  max_mutations_per_seq: 8
  stagea_max_mutations_per_seq: 8
  stageb_max_mutations_per_seq: 1
  mcts_num_beams: 8
  mcts_strategy: stage_a_only
  mcts_expand_actions_per_step: 2
  mcts_prior_mode: full
  esmfold2_stagea_soft_steps: 30
  esmfold2_stageb_soft_steps: 20
  esmfold2_stagea_tree_children: 2
  esmfold2_stagea_root_selection_mode: hierarchical_ucb
  esmfold2_stagea_min_root_expansions: 2
  esmfold2_stagea_preserve_soft_state: true
  esmfold2_stagea_cumulative_annealing: false
  esmfold2_stagea_mutation_fraction: 0.5
  esmfold2_stagea_candidate_strategy: positive_score
  esmfold2_stagea_include_argmax_candidate: true
  esmfold2_stagea_paired_verifier_seed: true
  esmfold2_logit_init_mode: official_exact
  esmfold2_proposal_num_loops: 1
  esmfold2_proposal_num_sampling_steps: 1
  esmfold2_proposal_load_internal_esmc: true
  esmfold2_proposal_lm_dropout: 0.5
  esmfold2_force_proposal_lm_dropout: true
  esmfold2_lambda_esmc: auto
  esmfold2_verifier_loss_mode: aligned_common
  esmfold2_one_step_diffusion: true
  esmfold2_one_step_diffusion_tau: 2.0
  esmfold2_one_step_diffusion_weight: 0.25
  esmfold2_one_step_diffusion_rg_weight: 0.1
  esmfold2_one_step_diffusion_interval: 5
  esmfold2_one_step_recycle_coordinates: false
  esmfold2_one_step_diffusion_hotspot: false
  esmfold2_distogram_hotspot: true
  esmfold2_track_proposal_confidence: false
  esmfold2_final_polish: false
  esmfold2_stagea_handoff_checkpoint_interval: 10
  esmfold2_hotspot_cutoff: 8.0
  esmfold2_hotspot_satisfied_proposal_weight: 0.0
  esmfold2_hotspot_interface_mode: localized
  esmfold2_hotspot_verify_weight: 0.0
  esmfold2_hotspot_verify_near_cutoff: 8.0
  esmfold2_hotspot_verify_far_cutoff: 20.0
  esmfold2_hotspot_verify_min_distance: 2.5
  esmfold2_hotspot_verify_too_close_weight: 0.0
  checkpoint_save_policy: all
